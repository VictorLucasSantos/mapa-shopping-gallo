<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Mapa Shopping Gallo · Região da 44</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1ee;--panel:#fff;--ink:#2a1519;--mut:#7a5a60;--line:#eadad7;--acc:#b8283f;--acc2:#6b1c2b;--corr:#efe3df;--store:#fff;--me:#1a73e8;--sel:#ffe3e3;--vaga:#fff1c2;--dest:#fff7e0;--halo:#fff;--chip:#f4e8e5;--navy:#6b1c2b;--navy2:#3a0f19;--gold:#f0b429;--shadow:0 2px 10px rgba(30,28,80,.14);--lst:#e65100;--glass:rgba(255,255,255,.78)}
[data-theme=dark]{--bg:#1a0d11;--panel:#26141a;--ink:#f1f0fb;--mut:#a9a7cf;--line:#4a2a33;--acc:#ff7a8f;--acc2:#e8a0ab;--corr:#3a232b;--store:#33202a;--me:#5aa0ff;--sel:#5b2a3a;--vaga:#4d3f10;--dest:#3b2a31;--halo:#14132e;--chip:#3a242c;--shadow:0 2px 12px rgba(0,0,0,.5);--lst:#ffa040;--glass:rgba(38,20,26,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;overflow:hidden;height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{padding:10px 12px 10px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;flex:none;position:relative}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#e02020,#ff8a1e,var(--gold))}
.top{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;padding:4px;object-fit:contain;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.logo.fb{display:grid;place-items:center;background:var(--acc);color:#fff;font-weight:900;font-size:16px;padding:0}
.ttl{flex:1;min-width:0}
.ttl b{font-size:17px;line-height:1.1;display:block;font-weight:900;letter-spacing:.2px;text-transform:uppercase}
.ttl b span{color:var(--gold);font-weight:700;text-transform:none;font-style:italic;margin-left:4px}
.ttl small{display:block;font-size:12.5px;opacity:.82;line-height:1.3;margin-top:2px}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;flex:none;display:grid;place-items:center;padding:0}
.ibtn.on{background:var(--me);border-color:var(--me)}
#inst{display:none}
#th .sun{display:none}[data-theme=dark] #th .sun{display:block}[data-theme=dark] #th .moon{display:none}
.search{position:relative}
.search input{width:100%;height:48px;font:inherit;font-size:16px;font-weight:500;padding:0 44px 0 44px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);outline:none;-webkit-appearance:none}
.search input::placeholder{color:var(--mut)}
.search input:focus{border-color:var(--acc)}
.search .si{position:absolute;left:13px;top:13px;color:var(--acc);pointer-events:none}
#qx{position:absolute;right:5px;top:6px;width:36px;height:36px;border:0;background:none;font-size:17px;color:var(--mut);display:none}
.sq{padding:6px 12px 8px;border-top:1px solid var(--line);flex:none;background:var(--panel)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:8px 0 2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap}
.chip .gi{width:17px;height:17px}
.chip.fac{background:var(--chip);border-color:transparent}
.chip.on{background:var(--acc2);border-color:var(--acc2);color:#fff}.chip.on .gi{color:#fff!important}
[data-theme=dark] .chip.on{background:var(--acc);color:#1a0d11}
#sheet[data-v=store] .sq,#sheet[data-v=list] .sq,#sheet[data-v=me] .sq,#sheet[data-v=fac] .sq{display:none}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
nav::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:13.5px;font-weight:700;padding:8px 13px;border-radius:999px;color:var(--mut);border:1px solid var(--line);cursor:pointer;white-space:nowrap;background:transparent}
.tab.on{color:#fff;background:var(--navy);border-color:var(--navy)}
[data-theme=dark] .tab.on{background:var(--acc);border-color:var(--acc);color:#14132e}
.tab b{font-size:11px;background:var(--acc);color:#fff;border-radius:999px;padding:1px 6px;margin-left:6px}
.tab.on b{background:#fff;color:var(--navy)}
.sep{width:1px;background:var(--line);flex:none;margin:4px 2px}
#mapwrap{position:relative;flex:1;min-height:0;touch-action:none;overflow:hidden;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/20px 20px,var(--bg)}
svg#map{width:100%;height:100%;display:block;user-select:none}
.fab{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:2px;padding:5px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);box-shadow:var(--shadow)}
.fab button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);font-size:21px;font-weight:800;display:grid;place-items:center;padding:0}
.fab button:active{background:var(--chip)}
.fab #navb{background:var(--acc2);color:#fff;margin-bottom:3px}
.fab button.on:not(#navb){background:var(--chip);color:var(--acc2)}
.fab .t3{font-size:14px;font-weight:900}
.fab .rot{display:none!important}
.fabl{position:absolute;left:10px;bottom:10px}
.fabl button{height:48px;padding:0 16px;border-radius:24px;border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);font-size:14px;font-weight:800;box-shadow:var(--shadow)}
.fabl button.on{background:var(--me);color:#fff;border-color:var(--me)}
#locb{position:absolute;left:10px;top:8px;max-width:calc(100% - 76px);display:none;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1.5px solid var(--me);color:var(--ink);font-size:14px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
#locb i{width:10px;height:10px;border-radius:50%;background:var(--me);box-shadow:0 0 0 4px rgba(26,115,232,.28);flex:none}
.hint{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:var(--navy2);color:#fff;font-size:13.5px;font-weight:500;padding:10px 14px;border-radius:12px;display:none;max-width:88%;text-align:center;z-index:3;box-shadow:var(--shadow)}
#sheet{background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(20,18,70,.18);display:flex;flex-direction:column;flex:none;transition:height .22s;overflow:hidden;border-top:1px solid var(--line)}
#sheet.peek{height:auto}#sheet.peek .body{display:none}#sheet.mid{height:42vh}#sheet.full{height:86vh}
#sheet.cm{height:auto}#sheet.cm .grab{padding:16px 14px 2px}#sheet.cm .body{overflow:visible;flex:none;padding-bottom:12px}
.grab{padding:18px 14px 10px;display:flex;align-items:center;gap:10px;cursor:grab;touch-action:none;position:relative;flex:none}
.grab:before{content:"";width:40px;height:5px;border-radius:5px;background:var(--line);position:absolute;left:50%;top:6px;transform:translateX(-50%)}
.grab .t{font-size:16px;font-weight:900;flex:1;min-width:0;line-height:1.25;overflow-wrap:anywhere}
.grab .m{font-size:12.5px;color:var(--mut);text-align:right;flex:none;max-width:45%}
.body{overflow:auto;padding:0 14px 18px;flex:1;-webkit-overflow-scrolling:touch}
h3{font-size:12.5px;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:1px solid var(--line);border-radius:16px;padding:10px 4px 9px;text-align:center;background:var(--panel);color:var(--ink)}
.cat .e{width:46px;height:46px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;font-size:25px;line-height:1}
.cat b{font-size:13px;display:block;line-height:1.2;overflow-wrap:anywhere;font-weight:700}.cat small{color:var(--mut);font-size:11.5px}
.item{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none}
.item .mid{flex:1;min-width:0}
.item .n{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.item .l{font-size:13px;color:var(--mut);line-height:1.35;margin-top:2px;overflow-wrap:anywhere}
.rt{display:flex;align-items:center;gap:8px;flex:none}
.dist{font-size:13px;font-weight:700;color:var(--acc2);white-space:nowrap}
.add{width:40px;height:40px;border-radius:50%;border:2px solid var(--acc);background:transparent;color:var(--acc);font-size:20px;font-weight:700;line-height:1;padding:0}
.add.in{background:var(--acc);color:#fff}
.star{color:#f0a500}
.card h2{font-size:21px;margin:2px 0 3px;line-height:1.2;font-weight:900;overflow-wrap:anywhere}
.loc{font-size:14px;color:var(--mut);font-weight:500;line-height:1.4}
.dsum{display:inline-flex;gap:6px;align-items:center;background:var(--chip);color:var(--acc2);font-weight:700;font-size:13.5px;padding:6px 12px;border-radius:999px;margin:8px 0 2px}
.promo{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--vaga);border:1px solid #e4b73a;font-size:14px;font-weight:500;line-height:1.4;color:var(--ink)}
.desc{font-size:14px;line-height:1.5;margin:6px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--chip)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{font-size:14.5px;font-weight:700;padding:0 14px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.2}
.btn.b{background:var(--navy);border-color:var(--navy);color:#fff;flex:1 1 150px}
[data-theme=dark] .btn.b{background:var(--me);border-color:var(--me)}
.btn.g{background:var(--acc);border-color:var(--acc);color:#fff;flex:1 1 150px}
.btn.g.in{background:transparent;color:var(--acc)}
.btn.w{background:#1faa59;border-color:#1faa59;color:#fff}
.btn.sm{min-height:40px;font-size:13.5px;padding:6px 12px}
.stepsbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:8px}
ol.steps{margin:5px 0 0;padding-left:20px;font-size:14.5px;line-height:1.5}ol.steps li{margin:6px 0}
.note{font-size:13px;color:var(--mut);line-height:1.5;margin-top:10px}.note a{color:var(--acc);font-weight:700}
.warn{font-size:13.5px;background:var(--vaga);border:1px solid #e4b73a;border-radius:12px;padding:10px 12px;margin-top:8px;line-height:1.45}
.empty{font-size:14.5px;color:var(--mut);padding:14px 0;line-height:1.55}
.intro{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:6px}
.intro ol{margin:6px 0 10px;padding-left:20px;font-size:14.5px;line-height:1.55}
.stop{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.num{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;font-weight:900;display:grid;place-items:center;flex:none;font-size:14px}
.stop .mid{flex:1;min-width:0;cursor:pointer}
.stop .n{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}.stop .l{font-size:13px;color:var(--mut);line-height:1.35}
.mini{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px;padding:0;color:var(--ink)}.mini:disabled{opacity:.35}
details.sp{margin:2px 0 4px 42px}details.sp summary{font-size:13.5px;font-weight:700;color:var(--acc);cursor:pointer;padding:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
footer#bar{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);flex:none}
#bar button{flex:1;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--mut);position:relative}
#bar button.on{color:var(--acc)}
#bar button.on:before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
#bd{position:absolute;top:3px;left:calc(50% + 6px);background:var(--acc);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;display:none}
.gi{width:1em;height:1em;vertical-align:-.14em;flex:none}
.ico .gi{width:26px;height:26px;vertical-align:0}.cat .e .gi{width:26px;height:26px;vertical-align:0}.tag .gi{width:15px;height:15px;vertical-align:-3px;margin-right:2px}.n .gi{width:16px;height:16px;vertical-align:-3px}
 .pv{touch-action:none}
.pv1{display:flex;gap:12px;align-items:center}
.pv1 .ico{width:54px;height:54px;font-size:28px}
.pvm{flex:1;min-width:0}.pvm h2{font-size:20px;margin:0;line-height:1.2;font-weight:900;overflow-wrap:anywhere}
.pvbox{margin-top:4px;font-size:14.5px;color:var(--mut);font-weight:500;line-height:1.35}
.boxn{display:inline-block;background:var(--acc2);color:#fff;font-weight:900;font-size:14.5px;padding:2px 9px;border-radius:8px;margin-right:6px}
[data-theme=dark] .boxn{background:var(--acc);color:#1a0d11}
.pvx{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);color:var(--ink);font-size:16px;flex:none;align-self:flex-start}
.pv2{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:10px 0 2px}
.bdg{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800;color:#fff}
.bdg.open{background:#0b7a3b}.bdg.soon{background:#b45309}.bdg.shut{background:#8a1f1f}
.seg{font-size:13.5px;font-weight:700;color:var(--ink);background:var(--chip);border-radius:999px;padding:4px 10px}
.pvd{font-size:13.5px;font-weight:800;color:var(--acc2)}
.pv3{display:flex;gap:8px;margin-top:12px}
.pv3 .btn{min-height:52px;font-size:16px;border-radius:14px}
.pv3 .pri{flex:1.35;background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:900}
[data-theme=dark] .pv3 .pri{background:var(--me);border-color:var(--me)}
.pv3 .sec{flex:1;white-space:nowrap;font-size:15px;padding:0 8px;background:var(--panel);border:2px solid var(--acc2);color:var(--acc2)}
.pv3 .sec.in{background:var(--chip)}
[data-theme=dark] .pv3 .sec{border-color:var(--me);color:var(--me)}
.pvmore{display:block;margin:10px auto 0;border:0;background:none;color:var(--mut);font-size:13px;font-weight:700;padding:4px 10px}
.tab .lb{font-style:normal;font-size:11px;font-weight:900;background:var(--lst);color:#fff;border-radius:999px;padding:1px 6px;margin-left:6px}
.pin{transform:scale(var(--ps,1))}
.tint{opacity:.07}
.clu{display:none}#map.zf .clu{display:block}
.mk .cm,.mk .pl{opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s}
#map.zm .mk .cm{opacity:1;visibility:visible}
#map.zn2 .mk .pl{opacity:1;visibility:visible}
#map.zn2 .mk.co .pl{opacity:0;visibility:hidden}
#map.zn2 .mk.co .cm{opacity:1;visibility:visible}
#map .mk.hid .cm,#map .mk.hid .pl{opacity:0!important;visibility:hidden!important}
#map.zm g .zi,#map.zn2 g .zi,#map.zn2 g .zl,#map.zn2 g .zn{display:none}
#map .mk .pin,#map .clu .pin{transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .18s}
#map .mk .pin{transform-origin:0 0}
#map.zn2 .mk .pin{transform:scale(var(--pls,1))}
#map g[data-id]:hover .mk .pin,#map .mk.sel .pin{filter:drop-shadow(0 0 7px rgba(255,190,60,.95))}
#map.zm g[data-id]:hover .mk .pin{transform:scale(calc(var(--ps,1)*1.12))}
#map.zn2 g[data-id]:hover .mk .pin{transform:scale(calc(var(--pls,1)*1.08))}
#map g[data-id]:active .mk .pin{transform:scale(calc(var(--ps,1)*1.2))}
#map.zn2 .stip{display:none}
#map .mk text,#map .mk .stip text{stroke:none}
#map.zf .tint{opacity:.42}#map.zm .tint{opacity:.2}
#map.zf .zl,#map.zf .zn,#map.zm .zl,#map.zm .zn{display:none}
#map.zf g:not(.anc) .zi{display:none}
#map.zf g.anc .zl{display:inline}
#map g[data-id] text,#map text.zc{paint-order:stroke;stroke:var(--halo);stroke-width:2px;stroke-linejoin:round}
[data-hc]{--ink:#000;--mut:#33252a;--line:#7d6a6f;--bg:#fff;--panel:#fff;--corr:#cdbab5;--store:#fff;--acc:#a30021;--acc2:#4a0010;--chip:#ece0dc;--halo:#fff;--glass:rgba(255,255,255,.96)}
[data-hc][data-theme=dark]{--ink:#fff;--mut:#e8d8dc;--line:#b49aa1;--bg:#000;--panel:#120a0d;--corr:#4d3a40;--store:#1d1216;--halo:#000;--glass:rgba(10,5,7,.96)}
[data-hc] #map g[data-id]>rect:first-child{stroke-width:2.2px!important;stroke:var(--ink)}
[data-hc] body,[data-hc] .item .l,[data-hc] .loc,[data-hc] .pvbox{font-weight:600}
[data-hc] #map text{font-weight:900!important;stroke-width:3px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card,.intro,.grid .cat,.item{animation:rise .28s cubic-bezier(.2,.8,.2,1) both}
.item,.cat,.btn,.tab,.add{transition:transform .12s,box-shadow .15s,background .15s}
.item:active,.cat:active,.btn:active{transform:scale(.98)}
.cat:hover{box-shadow:var(--shadow)}
.item{border-radius:12px;padding-left:4px;padding-right:4px}
.ico{box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
@media(prefers-reduced-motion:reduce){.card,.intro,.grid .cat,.item{animation:none}}
@keyframes dash{to{stroke-dashoffset:-24}}
@keyframes pulse{0%{r:9;opacity:.55}100%{r:30;opacity:0}}
@keyframes pulse3{0%{opacity:.4}100%{opacity:0}}
.route{animation:dash .8s linear infinite}.pulse{animation:pulse 1.6s ease-out infinite}.pulse3{animation:pulse3 1.6s ease-out infinite}
</style>
</head>
<body>
<header>
  <div class="top">
    <img class="logo" id="logo" alt="Shopping Gallo" src="https://regiaoda44.com/wp-content/uploads/2024/12/LOGO_GALLO-1.png" onerror="this.outerHTML='<div class=&quot;logo fb&quot;>G</div>'">
    <div class="ttl"><b>Shopping Gallo<span>Mapa</span></b><small id="sub">Região da 44 · Goiânia</small></div>

  <button data-v="me"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Onde estou</button>

<script>
"use strict";
const {BUILD,BORDER,FLOORS,SEGS,SEGCOLOR,esc} = MM;
const $ = id => document.getElementById(id);
let STORES = [], G = {}, INFO = {src:"embutido",date:""};
const st = {g:null,q:"",seg:null,sel:null,me:null,marking:false,gps:null,gpsB:null,gpsMsg:"",auto:false,
  view:"home",back:"home",sheet:"mid",card:false,fac:null,v3:false,rot:-30,list:[],manual:false,okey:"",more:60};
const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
st.me = lsGet("mm_me",null); if(!(st.me&&st.me.x!=null)) st.me=null;
st.v3 = lsGet("mm_v3",false); st.rot = lsGet("mm_rot",-30); st.list = lsGet("mm_list",[]); st.manual = lsGet("mm_manual",false);
let match = () => true;
const filtering = () => !!(st.seg || st.q.trim());

/* ---------- utilidades ---------- */
const fromPos = () => st.me && G[st.me.g] ? st.me : null;
const curRef = () => { const m=fromPos(); if(m) return {g:m.g,x:m.x,y:m.y}; const g=G[st.g]; return {g:g.key,x:g.entry.x,y:g.entry.y}; };
const refLabel = () => fromPos() ? "sua posição" : `entrada do ${BUILD[G[st.g].b].short} (${FLOORS[st.g.split("|")[1]].split(" ·")[0]})`;
const mTxt = m => m==null||!isFinite(m)?"":`~${Math.max(5,Math.round(m/5)*5)} m`;
const minTxt = m => `${Math.max(1,Math.round(m/70))} min a pé`;
const tint = s => (SEGCOLOR[s.prim]||"#999")+"22";
const locTxt = s => `${BUILD[s.b].short} · ${FLOORS[s.f].split(" ·")[0]} · ${esc(s.cor)}${s.num?` · ${esc(s.num)}`:""}`;
let dcache = {S:null,key:"",map:null};
function allDist(){
  const r=curRef(), key=r.g+"|"+Math.round(r.x)+"|"+Math.round(r.y);
  if (dcache.S===STORES && dcache.key===key) return dcache.map;
  dcache = {S:STORES,key,map:MM.distMany(G,r,STORES)}; return dcache.map;
}
const listStores = () => st.list.map(sl=>STORES.find(s=>s.s===sl)).filter(Boolean);
function ensureOrder(){
  if (!st.list.length) return [];
  if (!st.manual){
    const r=curRef(), key=r.g+"|"+Math.round(r.x)+"|"+Math.round(r.y)+"|"+st.list.slice().sort().join(",");
    if (st.okey!==key){ const o=MM.orderRoute(G,r,listStores()); st.list=o.map(s=>s.s); st.okey=key; lsSet("mm_list",st.list); }
  }
  return listStores();
}
function planList(){
  const order=ensureOrder(); let cur=fromPos(); const legs=[];
  order.forEach((s,i)=>{ legs.push(MM.leg(G,cur,s,i===0?"De onde você está,":`Saindo de <b>${esc(order[i-1].n)}</b>,`)); cur={g:s.g,x:s.door.x,y:s.door.y}; });
  return legs;
}
function toast(t,ms){ const h=$("hint"); h.textContent=t; h.style.display="block"; clearTimeout(toast.t); if(ms) toast.t=setTimeout(()=>{ if(!st.marking) h.style.display="none"; },ms); }

/* ---------- mapa (2D / 3D) ---------- */
const V = () => MM.proj3(G[st.g], st.rot);
let lodC="";
function lod(vb){
  const w=$("mapwrap").clientWidth||360, ppu=w/vb.w, c=ppu<.4?"zf":ppu<.7?"zm":"zn2", m=$("map");
  if(c!==lodC){ lodC=c; m.setAttribute("class",c); }
  m.style.setProperty("--ps",Math.max(1,Math.min(2.8,.8/ppu)).toFixed(2));
  m.style.setProperty("--pls",Math.max(.3,Math.min(1.2,.85/ppu)).toFixed(2));
  clearTimeout(lod.t); lod.t=setTimeout(declutter,320);
}
/* anti-colisão: nada se sobrepõe. Prioridade: selecionada, lista, destaque, resto. Tenta a pílula; se bater, vira só o ícone; se ainda bater, some até aproximar mais */
function declutter(){
  const m=$("map"); if(!m||(lodC!=="zn2"&&lodC!=="zm")) return;
  const box=$("mapwrap").getBoundingClientRect(), items=[], near=lodC==="zn2";
  m.querySelectorAll(".mk").forEach(mk=>{ mk.classList.remove("co","hid"); const cm=mk.querySelector(".cm circle"); if(!cm) return;
    const c=cm.getBoundingClientRect(), pl=mk.querySelector(".pl rect"), p=pl?pl.getBoundingClientRect():c, s=STORES[+mk.dataset.s];
    const out=r=>r.right<box.left||r.left>box.right||r.bottom<box.top||r.top>box.bottom; if(out(c)&&out(p)) return;
    items.push({mk,c,p,pr:!s?9:(st.sel===s.id?0:st.list.includes(s.s)?1:s.dest?2:s.vaga?3:4)}); });
  items.sort((a,b)=>a.pr-b.pr||a.c.top-b.c.top||a.c.left-b.c.left);
  const placed=[], hit=a=>placed.some(b=>!(a.right+3<b.left||a.left-3>b.right||a.bottom+2<b.top||a.top-2>b.bottom));
  for(const it of items){
    if(near&&!hit(it.p)){ placed.push(it.p); continue; }
    it.mk.classList.add("co");
    if(!hit(it.c)) placed.push(it.c); else{ it.mk.classList.remove("co"); it.mk.classList.add("hid"); }
  }
}
const pz = MM.panZoom($("map"), $("mapwrap"), {
  view:lod,
  tap(target, p){
    if (st.marking){ markAt(st.v3 ? V().inv(p.x,p.y) : p); return; }
    const cz = target.closest && target.closest("[data-cz]");
    if (cz && !st.v3){ const [x,y]=cz.getAttribute("data-cz").split("|").map(Number); centerOn(x,y,430); return; }
    const el = target.closest && target.closest("[data-id]");
    if (el) selectStore(+el.getAttribute("data-id"), false);
  }
});
function centerOn(x,y,w){ const p = st.v3 ? V().P(x,y,0) : {x,y}; pz.center(p.x,p.y,w); }
function fit(){ const g=G[st.g]; if(g) pz.fit(st.v3 ? V().bounds : MM.bounds(g)); }
function draw(){
  const g=G[st.g]; if(!g) return;
  let paths=null, badges=[]; const s = st.sel!=null ? STORES[st.sel] : null;
  const fac = st.view==="fac" && st.fac ? st.fac : null;
  if (st.view==="store" && s && !st.card){ const lg=MM.leg(G,fromPos(),s,""); paths = lg.parts.filter(p=>p.g===st.g).map(p=>p.pts); badges=lg.vert.filter(v=>v.g===st.g); }
  else if (fac){ paths = fac.lg.parts.filter(p=>p.g===st.g).map(p=>p.pts); badges=fac.lg.vert.filter(v=>v.g===st.g); }
  else if (st.view==="list" && st.list.length){ paths=[]; planList().forEach(l=>{ l.parts.forEach(p=>{ if(p.g===st.g) paths.push(p.pts); }); (l.vert||[]).forEach(v=>{ if(v.g===st.g) badges.push(v); }); }); }
  const stops={}; ensureOrder().forEach((x,i)=>stops[x.id]=i+1);
  const o={fac:!!fac, filter:filtering()?match:null, sel:st.sel, paths, badges, me:st.me&&st.me.g===st.g?st.me:null, stops:Object.keys(stops).length?stops:null};
  $("map").innerHTML = st.v3 ? MM.draw3d(g,Object.assign(o,{V:V()})) : MM.draw(g,o);
  clearTimeout(lod.t); lod.t=setTimeout(declutter,320);
}
function fitRoute(){
  const g=G[st.g], pts=[]; let paths=[];
  if(st.view==="store"&&st.sel!=null){ MM.leg(G,fromPos(),STORES[st.sel],"").parts.forEach(p=>{ if(p.g===st.g) paths.push(p.pts); }); }
  else if(st.view==="fac"&&st.fac){ st.fac.lg.parts.forEach(p=>{ if(p.g===st.g) paths.push(p.pts); }); }
  else if(st.view==="list"){ planList().forEach(l=>l.parts.forEach(p=>{ if(p.g===st.g) paths.push(p.pts); })); }
  paths.forEach(a=>a.forEach(p=>pts.push(st.v3?V().P(p.x,p.y,0):p)));
  const m=fromPos(); if(m&&m.g===st.g) pts.push(st.v3?V().P(m.x,m.y,0):m);
  if(!pts.length||!g) return fit();
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity; pts.forEach(p=>{ x0=Math.min(x0,p.x); y0=Math.min(y0,p.y); x1=Math.max(x1,p.x); y1=Math.max(y1,p.y); });
  const pad=50, w=Math.max(160,x1-x0+pad*2), h=Math.max(120,y1-y0+pad*2);
  pz.fit({x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h},Infinity);
}
$("zin").onclick=()=>pz.zoom(1.4); $("zout").onclick=()=>pz.zoom(1/1.4); $("zfit").onclick=fit;
function setV3(on){
  st.v3=on; lsSet("mm_v3",on); $("v3").classList.toggle("on",on); $("v3").textContent=on?"2D":"3D"; $("mapwrap").classList.toggle("v3",on);
  draw(); if(st.sel!=null&&st.view==="store"){ const s=STORES[st.sel]; centerOn(s.door.x,s.door.y,340); } else fit();
}
$("v3").onclick=()=>setV3(!st.v3);
function rotate(d){
  const g=G[st.g], vb=pz.vb(), c=V().inv(vb.x+vb.w/2, vb.y+vb.h/2);
  st.rot=(st.rot+d)%360; lsSet("mm_rot",st.rot); draw();
  const p=MM.proj3(g,st.rot).P(c.x,c.y,0); pz.center(p.x,p.y,vb.w);
}
$("rl").onclick=()=>rotate(-30); $("rr").onclick=()=>rotate(30);

/* ---------- posição ---------- */
const saveMe = () => lsSet("mm_me",st.me);
function markAt(p){ const g=G[st.g], q=MM.nearest(g,p); st.me={g:st.g,x:q.x,y:q.y,how:"mapa"}; saveMe(); setMarking(false); refresh(); centerOn(q.x,q.y); toast("📍 Posição marcada. Distâncias atualizadas.",2200); if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){} }
function renderLoc(){
  const b=$("locb"), m=fromPos();
  if(!m){ b.style.display="none"; return; }
  const g=G[m.g], lane=MM.laneAt(g,m), fl=FLOORS[g.f].split(" ·")[0];
  b.innerHTML=`<i></i>Você está no ${esc(fl)}${lane?" · "+esc(lane):""}`; b.style.display="flex";
}
$("locb").onclick=()=>{ const m=fromPos(); if(!m) return; if(m.g!==st.g) showGroup(m.g,false); centerOn(m.x,m.y,360); };
function meAtStore(id){ const s=STORES[id]; st.me={g:s.g,x:s.door.x,y:s.door.y,how:"loja"}; saveMe(); refresh(); centerOn(s.door.x,s.door.y); toast("📍 Posição marcada em "+s.n,2500); }
function setMarking(on){ st.marking=on; $("mark").classList.toggle("on",on); $("mark").textContent=on?"✕ Cancelar":"📍 Marcar onde estou"; if(on){ setSheet("peek"); toast("Toque no corredor onde você está"); } else $("hint").style.display="none"; }
$("mark").onclick=()=>setMarking(!st.marking);
function applyHash(){
  const h=location.hash.slice(1); if(!h.startsWith("qr-")) return;
  const r=MM.resolveQR(h,G); if(!r) return;
  st.me={g:r.g,x:r.x,y:r.y,how:"qr"}; saveMe(); showGroup(r.g,false); centerOn(r.x,r.y,380); refresh();
  toast("📍 Você está em: "+r.label,4000); MM.track("qr",{ponto:h});
}
window.addEventListener("hashchange",applyHash);

/* ---------- barra inferior e painel ---------- */
function applySheet(){ $("sheet").className=st.sheet+(st.view==="store"&&st.card?" cm":""); $("sheet").dataset.v=st.view; }
function setSheet(s){ st.sheet=s; applySheet(); markBar(); }
function markBar(){
  const v = st.sheet==="peek" ? "map" : st.view==="list" ? "list" : st.view==="me" ? "me" : "home";
  document.querySelectorAll("#bar button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  const n=st.list.length; $("bd").style.display=n?"block":"none"; $("bd").textContent=n;
}
$("bar").onclick=e=>{ const b=e.target.closest("button[data-v]"); if(!b) return; const v=b.dataset.v; setMarking(false);
  if(v==="map"){ setSheet("peek"); return; }
  st.sel=null; st.view = v==="home" ? (filtering()?"results":"home") : v; setSheet(st.sheet==="peek"?"mid":st.sheet); refresh(); $("sb").scrollTop=0; if(v==="home") $("q").focus({preventScroll:true}); };
/* arrastar a gaveta: para cima abre, para baixo fecha (cartão de loja, rota, painel) */
function dismiss(){
  if(st.view==="store"){ backFromStore(); return true; }
  if(st.view==="fac"){ closeFac(); return true; }
  if(st.sheet==="full"){ setSheet("mid"); return true; }
  if(st.sheet==="mid"){ setSheet("peek"); return true; }
  return false;
}
function expandUp(){
  if(st.view==="store"&&st.card){ st.card=false; renderSheet(); draw(); fitRoute(); return; }
  const o=["peek","mid","full"], i=o.indexOf(st.sheet); setSheet(o[Math.min(2,i+1)]);
}
{ const gr=$("grab"); let y0=null, moved=false;
  gr.addEventListener("pointerdown",e=>{ y0=e.clientY; moved=false; gr.setPointerCapture(e.pointerId); });
  gr.addEventListener("pointermove",e=>{ if(y0==null||moved) return; const d=e.clientY-y0; if(Math.abs(d)>28){ moved=true; if(d<0) expandUp(); else dismiss(); } });
  gr.addEventListener("pointerup",()=>{ if(y0!=null&&!moved){ if(st.view==="store"&&st.card) expandUp(); else setSheet(st.sheet==="peek"?"mid":"peek"); } y0=null; });
  /* deslizar para baixo em qualquer parte do cartão/painel (quando a lista está no topo) */
  const sh=$("sheet"), sb=$("sb"); let ty=null, tx=null;
  sh.addEventListener("touchstart",e=>{ if(e.target.closest(".grab,.sq")){ ty=null; return; } ty=e.touches[0].clientY; tx=e.touches[0].clientX; },{passive:true});
  sh.addEventListener("touchmove",e=>{ if(ty==null) return; const dy=e.touches[0].clientY-ty, dx=Math.abs(e.touches[0].clientX-tx);
    if(dy>70&&dx<60&&sb.scrollTop<=2){ ty=null; dismiss(); } },{passive:true});
  sh.addEventListener("touchend",()=>{ ty=null; },{passive:true});
}

/* ---------- abas de prédio/andar e filtro ---------- */
function renderTabs(){
  let h="", last=null;
  for (const k of MM.groupOrder(G)){
    const g=G[k]; if (last && last!==g.b) h+=`<span class="sep"></span>`;
    const n = filtering() ? g.stores.filter(match).length : 0;
    const ln=g.stores.filter(x=>st.list.includes(x.s)).length;
    h+=`<span class="tab ${st.g===k?"on":""}" data-g="${k}">${BUILD[g.b].short} · ${FLOORS[g.f].split(" ·")[0]}${n?`<b>${n}</b>`:""}${ln?`<i class="lb" title="na sua lista">★${ln}</i>`:""}</span>`; last=g.b;
  }
  $("tabs").innerHTML=h;
  const on=$("tabs").querySelector(".tab.on"); if(on&&on.scrollIntoView) on.scrollIntoView({inline:"center",block:"nearest"});
}
$("tabs").onclick = e => { const t=e.target.closest(".tab"); if(t) showGroup(t.dataset.g,true); };
const FAC=[["wc","Banheiros"],["caixa","Caixas"],["estac","Estacionamento"]];
function renderFilter(){
  $("qx").style.display=st.q?"block":"none";
  const c={}; STORES.forEach(x=>x.cats.forEach(k=>c[k]=(c[k]||0)+1));
  const first=["Alimentação"], rest=SEGS.map(a=>a[0]).filter(k=>c[k]&&!first.includes(k));
  const fac=k=>`<button class="chip fac ${st.view==="fac"&&st.fac&&st.fac.t===k?"on":""}" data-fac="${k}"><span aria-hidden="true">${MM.MT[k][0]}</span>${FAC.find(a=>a[0]===k)[1]}</button>`;
  const seg=k=>`<button class="chip ${st.seg===k?"on":""}" data-cat="${esc(k)}">${MM.icoHTML(k,st.seg===k?"#fff":undefined)}${esc(k)}</button>`;
  $("chips").innerHTML=fac("wc")+(c["Alimentação"]?seg("Alimentação"):"")+fac("caixa")+fac("estac")+rest.map(seg).join("");
}
$("chips").onclick=e=>{
  const f=e.target.closest("[data-fac]"); if(f){ goFac(f.dataset.fac); return; }
  const c=e.target.closest("[data-cat]"); if(!c) return;
  const k=c.dataset.cat; st.seg = st.seg===k ? null : k; st.sel=null; st.fac=null; st.view=filtering()?"results":"home"; st.more=60; if(st.sheet==="peek") setSheet("mid"); refresh(true); $("sb").scrollTop=0;
};
$("qx").onclick=()=>{ $("q").value=""; st.q=""; st.sel=null; st.view=filtering()?"results":"home"; refresh(true); };
/* banheiro / caixa / estacionamento mais perto */
function goFac(t){
  const list=[]; for(const k in (MM.MARCOS||{})) if(G[k]) (MM.MARCOS[k]||[]).forEach(m=>{ if(m.t===t) list.push({k,m}); });
  const nm=MM.MT[t][1];
  if(!list.length){ toast(`${MM.MT[t][0]} ${nm}: ainda não marcado neste mapa. O administrador marca no painel.`,3800); return; }
  let best=null;
  list.forEach(({k,m})=>{ const g=G[k], ps={id:-1,g:k,b:g.b,f:g.f,n:nm,cor:"",door:{x:m.x,y:m.y}}; const lg=MM.leg(G,fromPos(),ps,"De onde você está,"); if(!best||lg.m<best.lg.m) best={t,g:k,x:m.x,y:m.y,lg,ps}; });
  st.fac=best; st.sel=null; st.view="fac"; st.seg=null; $("q").value=""; st.q="";
  if(st.g!==best.g) showGroup(best.g,false);
  setSheet("mid"); refresh(); fitRoute(); MM.track("facilidade",{tipo:t});
}
function closeFac(){ st.fac=null; st.view=filtering()?"results":"home"; refresh(); }
function viewFac(){
  const f=st.fac, g=G[f.g], nm=MM.MT[f.t][1];

function openCam(s, fromList){
  const g=G[s.g], me=fromPos(), same=!!me&&me.g===s.g;
  if (st.g!==s.g) showGroup(s.g,false);
  MM.track("cam",{loja:s.s});
  const order = fromList ? ensureOrder() : [];
  let idx = fromList ? order.findIndex(x=>x.id===s.id) : -1;
  const more = () => fromList && idx>=0 && idx<order.length-1;
  const arr=same?null:((MM.leg(G,me,s,"").vert||[]).find(v=>v.g===s.g)||g.entry);
  MM.cam.open({ g, store:s, from: same ? me : arr,
    move(p,key){ st.me={g:key||g.key,x:p.x,y:p.y,how:"cam"}; saveMe(); },
    qr(code,gg){ const r=MM.resolveQR(code,G); if(!r||r.g!==gg.key) return null; MM.track("qr",{ponto:code}); return {x:r.x,y:r.y}; },
    tag(){ return fromList&&idx>=0 ? `Parada ${idx+1}/${order.length}` : ""; },
    hasNext: more,
    next(){ if(!more()) return null; idx++; const n=order[idx], gg=G[n.g], prev=order[idx-1], sameG=prev.g===n.g;
      return { g:gg, store:n, from: sameG ? {x:prev.door.x,y:prev.door.y} : gg.entry, note: sameG ? "" : `Próxima parada em outro andar/prédio: ${BUILD[n.b].short} · ${FLOORS[n.f].split(" ·")[0]}. Vá até a entrada/escada e siga a seta.` }; },
    close(){ refresh(); } });
  if (!same) setTimeout(()=>{ const m=document.getElementById("cmsg"); if(m){ m.textContent=`Rota a partir da entrada do ${FLOORS[g.f].split(" ·")[0]} do ${BUILD[g.b].short}. Leia o QR Code de um corredor para começar de onde você está.`; m.style.display="block"; } },300);
}

function startGPS(silent){
  silent = silent===true;
  if (!silent){ st.view="me"; if(st.sheet==="peek") setSheet("mid"); }
  if (!("geolocation" in navigator)){ st.gpsMsg="Este navegador não tem GPS."; return silent ? null : refresh(); }
  if (st.watch) { if(!silent) renderSheet(); return; }
  st.gpsMsg="Procurando sua localização…"; if(!silent) refresh(); else toast("📍 Procurando em qual prédio você está…",2500);
  try{ st.watch=navigator.geolocation.watchPosition(p=>{
    st.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
    let best=null; for(const k of BORDER){ const d=MM.hav(st.gps.lat,st.gps.lng,BUILD[k].lat,BUILD[k].lng); if(!best||d<best.d) best={k,d}; }
    st.gpsB=best; const inside=best.d<120+Math.min(st.gps.acc,80);
    $("gps").classList.add("on");
    st.gpsMsg=inside?`📍 Você está no ${BUILD[best.k].name} (±${Math.round(st.gps.acc)} m).`:`Você está a ${best.d>1000?(best.d/1000).toFixed(1)+" km":Math.round(best.d)+" m"} do ${BUILD[best.k].name}.`;
    if (inside && !st.auto){ st.auto=true; const k=G[best.k+"|T"]?best.k+"|T":Object.keys(G).find(x=>x.startsWith(best.k)); if(k && G[st.g].b!==best.k) showGroup(k,true);
      if(!st.me && k){ const gg=G[k]; st.me={g:k,x:gg.entry.x,y:gg.entry.y,how:"entrada"}; refresh(); initialView(); }
      toast("📍 Você está no "+BUILD[best.k].name,3500); }
    if (st.view==="me") renderSheet();
  }, err=>{ st.watch=null; st.gpsMsg=err.code===1?"A permissão de localização foi negada ou está bloqueada nesta janela. No site publicado (HTTPS), permita o acesso ao local.":"Não foi possível obter o GPS agora."; $("gps").classList.remove("on"); if(st.view==="me") renderSheet(); }, {enableHighAccuracy:true,maximumAge:5000,timeout:20000}); }
  catch(e){ st.gpsMsg="GPS indisponível nesta janela."; refresh(); }
}
$("gps").onclick=startGPS;
function calibrate(){
  const g=G[st.g], k=g.b; Object.assign(BUILD[k],{lat:st.gps.lat,lng:st.gps.lng,cal:true});
  const c=lsGet("mm_cal",{}); c[k]={lat:st.gps.lat,lng:st.gps.lng}; lsSet("mm_cal",c);
  const t=G[k+"|T"]||g; st.me={g:t.key,x:t.entry.x,y:t.entry.y,how:"entrada"}; saveMe(); refresh();
}

/* ---------- tema claro / escuro ---------- */
function applyTheme(t,redraw){
  document.documentElement.dataset.theme=t; MM.dark=(t==="dark"); lsSet("mm_theme",t);
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.content=t==="dark"?"#3a0f19":"#6b1c2b";
  if(redraw && G[st.g]) draw();
}
MM.dark = document.documentElement.dataset.theme==="dark";
$("th").onclick=()=>applyTheme(MM.dark?"light":"dark",true);

/* ---------- alto contraste (sol forte) ---------- */
function applyHC(on){ document.documentElement.toggleAttribute("data-hc",on); $("hc").classList.toggle("on",on); $("hc").setAttribute("aria-pressed",on); lsSet("mm_hc",on); }
$("hc").onclick=()=>applyHC(!document.documentElement.hasAttribute("data-hc"));
applyHC(!!lsGet("mm_hc",false));

/* ---------- girar o mapa 3D com dois dedos (sem botões na tela) ---------- */
{ const m=$("map"), P=new Map(); let a0=null, acc=0;
  const ang=()=>{ const [a,b]=[...P.values()]; return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI; };
  m.addEventListener("pointerdown",e=>{ P.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(P.size===2){ a0=ang(); acc=0; } });
  m.addEventListener("pointermove",e=>{ if(!P.has(e.pointerId)) return; P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(P.size!==2||!st.v3||a0==null) return; let a=ang(), d=a-a0; if(d>180) d-=360; if(d<-180) d+=360; a0=a; acc+=d;
    if(Math.abs(acc)>=28){ rotate(acc>0?30:-30); acc=0; } });
  const up=e=>{ P.delete(e.pointerId); a0=null; acc=0; };
  m.addEventListener("pointerup",up); m.addEventListener("pointercancel",up); }

/* ---------- instalar (PWA) ---------- */
let deferred=null;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; $("inst").style.display="grid"; });
$("inst").onclick=async()=>{ if(!deferred) return; deferred.prompt(); try{ await deferred.userChoice; }catch(e){} deferred=null; $("inst").style.display="none"; };
if ("serviceWorker" in navigator && location.protocol==="https:" && window.top===window) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- início ---------- */
function boot(data){
  const keep = st.sel!=null && STORES[st.sel] ? STORES[st.sel].s : null;
  INFO={src:data.src,date:data.date};
  if (data.layouts && data.layouts.predios) for(const k in data.layouts.predios) if(BUILD[k] && !BUILD[k].cal) Object.assign(BUILD[k],data.layouts.predios[k]);
  const b=MM.build(data.stores,data.layouts); STORES=b.stores; G=b.G;
  if (st.me && !G[st.me.g]) st.me=null;
  st.list=st.list.filter(sl=>STORES.some(s=>s.s===sl)); st.okey="";
  st.sel=null; st.view="home"; st.g = st.me ? st.me.g : (G["shopping|T"]?"shopping|T":MM.groupOrder(G)[0]);
  match=MM.matcher(STORES,st.q,st.seg);
  $("v3").classList.toggle("on",st.v3); $("v3").textContent=st.v3?"2D":"3D"; $("mapwrap").classList.toggle("v3",st.v3);
  showGroup(st.g,false); refresh(); requestAnimationFrame(()=>{ initialView(); applyHash(); applyLink(keep); });
}
/* visão inicial: perto do usuário ou da entrada, já legível (o botão ⤢ mostra o andar inteiro) */
function initialView(){
  const g=G[st.g]; if(!g) return;
  if (filtering()) return fit();
  const m=fromPos(); if (m && m.g===st.g) return centerOn(m.x,m.y,440);
  centerOn(g.entry.x+(g.b==="park"?110:210),g.entry.y+(g.b==="park"?240:150),g.b==="park"?420:500);
}
/* link direto: ?loja=slug  (também aceita o nome, sem acento) */
let linkDone=false;
function applyLink(keep){
  let slug=keep;
  if(!slug && !linkDone){ linkDone=true; try{ slug=new URLSearchParams(location.search).get("loja"); }catch(e){} if(slug) MM.track("link",{loja:String(slug).slice(0,100)}); }
  if(!slug) return;
  const q=MM.slugify(slug), s=STORES.find(x=>x.s===slug)||STORES.find(x=>MM.slugify(x.s)===q)||STORES.find(x=>MM.slugify(x.n)===q);
  if(!s){ if(!keep) toast("Não encontramos essa loja. Use a busca.",3500); return; }
  st.back="home"; selectStore(s.id,true,!!keep); setSheet("mid");
}
window.addEventListener("resize",fit);
/* ao abrir: pede o GPS sozinho para descobrir o prédio (sem o usuário escolher) */
let gpsAsked=false;
function autoGPS(){
  if(gpsAsked) return; gpsAsked=true;
  const go=()=>startGPS(true);
  try{ if(navigator.permissions&&navigator.permissions.query) navigator.permissions.query({name:"geolocation"}).then(q=>{ if(q.state!=="denied") go(); },go); else go(); }catch(e){ go(); }
}
boot({stores:MM.embedded(),layouts:{},src:"embutido",date:window.MM_DATE||""});
setTimeout(autoGPS,600);
MM.load().then(d=>{ if(d.src!=="embutido"||Object.keys(d.layouts).length) boot(d); MM.track("abrir"); });
</script>
